[project]
name = "govi-disease-detection"
version = "1.0.0"
description = "Production-level crop disease detection AI with incremental learning"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
